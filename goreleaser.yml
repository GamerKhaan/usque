version: 2
project_name: usque
builds:
  - id: core
    main: .
    binary: usque
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/Diniboy1123/usque/cmd.version={{.Tag}}
      - -X github.com/Diniboy1123/usque/cmd.commit={{.Commit}}
      - -X github.com/Diniboy1123/usque/cmd.date={{.CommitDate}}
  - id: supervisor
    main: ./cmd/usque-supervisor
    binary: usque-supervisor
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Tag}}
      - -X main.commit={{.Commit}}
archives:
  - ids: [core, supervisor]
    formats: [tar.gz]
    name_template: 'usque_{{.Version}}_{{.Os}}_{{.Arch}}'
    files:
      - LICENSE.md
      - README.md
      - src: scripts/usquectl
        dst: usquectl
        info:
          mode: 0755
      - deploy/*
      - docs/*.md
checksum:
  name_template: checksums.txt
  algorithm: sha256
release:
  github:
    owner: GamerKhaan
    name: usque
  # Fork suffixes identify locally carried patches. Release publication is manual
  # after CI; published service releases are eligible for explicit usquectl update.
  prerelease: false
changelog:
  use: git
